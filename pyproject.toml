[project]
name = "aruco-frame-preprocessing"
version = "0.1.0"
description = ""
authors = [
    {name = "Felipe Merenda Izidorio",email = "felipemerenda1@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,!=3.14.1,<3.15"
dependencies = [
    "opencv-contrib-python (>=4.13.0.92,<5.0.0.0)",
    "numpy (>=2.4.4,<3.0.0)",
    "torch (>=2.11.0,<3.0.0)",
    "torchvision (>=0.26.0,<0.27.0)"
]

[dependency-groups]
dev = [
    "ruff (>=0.15.11,<0.16.0)",
    "pyright (>=1.1.408,<2.0.0)"
]

[tool.poetry]
package-mode = false

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
include = ["src"]
exclude = ["**/node_modules", "**/__pycache__", "**/.*", ".venv"]
pythonVersion = "3.12"
pythonPlatform = "Linux"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
