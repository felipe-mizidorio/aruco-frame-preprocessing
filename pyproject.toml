[project]
name = "aruco-frame-preprocessing"
version = "0.1.0"
description = ""
authors = [
    {name = "Felipe Merenda Izidorio",email = "felipemerenda1@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,!=3.14.1,<3.15"
dependencies = [
    "opencv-contrib-python>=4.13.0.92,<5.0.0.0",
    "opencv-python>=4.13.0.92",
    "numpy>=2.4.4,<3.0.0",
    "torch>=2.11.0,<3.0.0",
    "torchvision>=0.26.0,<0.27.0",
    "scipy>=1.13.0,<2.0.0",
    "shapely>=2.0.0,<3.0.0",
    "fpdf2>=2.8.7",
]

[project.optional-dependencies]
deeparuco = [
    "tensorflow>=2.15.0,<3.0.0",
    "ultralytics>=8.0.0,<9.0.0",
]

[project.scripts]
aruco-extract = "aruco_pipeline.stages.frame_extraction:main"
aruco-detect = "aruco_pipeline.stages.aruco_detection:main"
aruco-filter = "aruco_pipeline.stages.frame_filtering:main"
aruco-mask = "aruco_pipeline.stages.mask_generation:main"
aruco-compare = "aruco_pipeline.stages.deeparuco_comparison:main"
aruco-generate-markers = "aruco_pipeline.markers.generate_markers:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aruco_pipeline"]

[dependency-groups]
dev = [
    "ruff>=0.15.11,<0.16.0",
    "pyright>=1.1.408,<2.0.0",
    "pre-commit>=4.6.0,<5.0.0",
    "pytest>=9.0.3",
]

[tool.ruff]
target-version = "py312"
exclude = ["src/aruco_pipeline/deeparuco_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/aruco_pipeline/deeparuco_vendor/*" = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src/aruco_pipeline"]
exclude = ["**/node_modules", "**/__pycache__", "**/.*", ".venv"]
pythonVersion = "3.12"
pythonPlatform = "Linux"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
