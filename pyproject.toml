[project]
name = "aruco-frame-preprocessing"
version = "0.1.0"
description = ""
authors = [
    {name = "Felipe Merenda Izidorio",email = "felipemerenda1@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,!=3.14.1,<3.15"
dependencies = [
    "opencv-contrib-python>=4.13.0.92,<5.0.0.0",
    "opencv-python>=4.13.0.92",
    "numpy>=2.4.4,<3.0.0",
    "torch>=2.11.0,<3.0.0",
    "torchvision>=0.26.0,<0.27.0",
    "tensorflow>=2.15.0,<3.0.0",
    "ultralytics>=8.0.0,<9.0.0",
    "scipy>=1.13.0,<2.0.0",
    "shapely>=2.0.0,<3.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.11,<0.16.0",
    "pyright>=1.1.408,<2.0.0",
    "pre-commit>=4.6.0,<5.0.0",
    "pytest>=9.0.3",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src"]
exclude = ["**/node_modules", "**/__pycache__", "**/.*", ".venv"]
pythonVersion = "3.12"
pythonPlatform = "Linux"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
